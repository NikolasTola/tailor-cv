[project]
name = "tailor-cv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nikolas Victor Mota", email = "nikolasVictorTola@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.3",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
    "reportlab>=5.0.1",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
tailorcv = "tailor_cv.cli:app"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
