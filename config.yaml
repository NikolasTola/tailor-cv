# Configuração do TailorCV.

# Modelo de cada agente, no formato "provedor:modelo".
# Confira os nomes atuais no Google AI Studio e no console do Groq.
modelos:
  analisador:  google_genai:gemini-2.5-flash
  experiencia: google_genai:gemini-2.5-flash
  resumo:      google_genai:gemini-2.5-flash
  formacao:    google_genai:gemini-2.5-flash-lite
  cursos:      google_genai:gemini-2.5-flash-lite
  habilidades: google_genai:gemini-2.5-flash-lite
  validador:   groq:openai/gpt-oss-120b

limites:
  paginas_max: 2
  resumo_palavras_max: 80
  bullet_palavras_max: 25
  experiencias:
    nota_corte: 4          # abaixo disso, a experiência é omitida
    nota_relevante: 7      # a partir disso, a experiência ganha mais bullets
    max: 5
    bullets_relevante: [3, 5]
    bullets_secundaria: [1, 2]
  cursos_max: 6
  habilidades_max: 14

# Bloqueiam o currículo se aparecerem no texto (sem diferenciar maiúsculas).
palavras_proibidas:
  - apaixonada
  - apaixonado
  - proativa
  - proativo
  - sinergia
  - fora da caixa
  - vestir a camisa